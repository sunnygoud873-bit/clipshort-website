<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPSHORT AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
header{height:64px;display:flex;justify-content:center;align-items:center;background:#000;border-bottom:1px solid #222;position:relative;z-index:100}
/* LOGO - NO GLITCH - Smooth Only */
.logo-img{height:42px;width:auto;display:block;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(168,85,247,0.6))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wrap{position:relative;width:100%;height:calc(100vh - 64px);overflow:hidden;background:#000}
#loader{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
#loader b{font-size:18px;letter-spacing:1px;margin-top:10px}
#loader p{color:#aaa;font-size:13px;margin-top:8px}
.loader-img{height:85px;width:auto;animation:float 2s ease-in-out infinite}
.boot-bar{width:200px;height:6px;background:#222;border-radius:10px;overflow:hidden;margin:16px 0 8px}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#ec4899,#00e5ff);animation:boot 1.4s ease-out forwards}
@keyframes boot{0%{width:0%}40%{width:55%}70%{width:82%}100%{width:100%}}
.boot-text{font-size:11px;color:#a855f7;letter-spacing:2px}
iframe{width:100%;height:calc(100% + 90px);margin-top:-45px;margin-bottom:-45px;border:0;display:block;background:#000}
</style>
</head>
<body>

<header>
<img src="logo.png" class="logo-img" alt="ClipShort AI">
</header>

<div class="wrap">
<div id="loader">
<img src="logo.png" class="loader-img" alt="ClipShort AI">
<b>CLIPSHORT AI</b>
<div class="boot-bar"><div class="boot-fill"></div></div>
<div class="boot-text">FAST BOOT...</div>
<p>App Starting...</p>
</div>
<iframe src="https://clipshort-ai.streamlit.app/?embed=true" onload="document.getElementById('loader').style.display='none'"></iframe>
</div>

</body>
</html>
