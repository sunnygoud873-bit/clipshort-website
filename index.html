<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLIPSHORT AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;overflow:hidden;font-family:'Inter',sans-serif}
header{height:64px;display:flex;align-items:center;gap:10px;background:#0A0A0A;border-bottom:1px solid #1E1E1E;padding:0 16px}
.logo-badge{width:34px;height:34px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;line-height:1;color:#fff}
.logo-sub{font-size:10px;color:#888;margin-top:3px}
.wrap{width:100%;height:calc(100vh - 64px);overflow:hidden;background:#0A0A0A}
iframe{width:100%;height:calc(100% + 145px);border:0;display:block;background:#0A0A0A;margin-top:-145px}
</style>
</head>
<body>
<header>
<div class="logo-badge">✂️</div>
<div><div class="logo-text">ClipShort AI</div><div class="logo-sub">Clipper & Downloader Insta</div></div>
</header>
<div class="wrap">
<iframe src="https://clipshort-ai.streamlit.app/?embed=true"></iframe>
</div>
</body>
</html>
