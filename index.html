<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLIPSHORT AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A12;color:#fff;overflow:hidden;font-family:'Inter',sans-serif}
/* HEADER - LEFT + UNDER LOGO TEXT */
header{height:72px;display:flex;justify-content:flex-start;align-items:center;gap:11px;background:linear-gradient(180deg,#12121E 0%,#0A0A12 100%);border-bottom:1px solid #1E1E2E;padding:0 16px;position:relative;z-index:100}
.logo-badge{width:38px;height:38px;background:linear-gradient(135deg,#a855f7,#ec4899,#f97316);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 20px rgba(168,85,247,0.5)}
.logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.6px;line-height:1}
.logo-text span{background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
/* UNDER LOGO - MAN ADIGINDHI IDHE! */
.logo-sub{font-size:11px;font-weight:600;letter-spacing:0.2px;color:#A1A1B3;margin-top:4px}
.logo-sub b{color:#fff}
.logo-col{display:flex;flex-direction:column;align-items:flex-start}
/* TABS - FEEL GOOD - PILL STYLE */
.tabs{display:flex;gap:10px;background:#0A0A12;padding:14px 16px}
.tab{flex:1;height:46px;border-radius:14px;border:1px solid #26263A;background:#15151F;color:#A1A1B3;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer}
.tab.active{background:linear-gradient(90deg,#a855f7,#ec4899);color:#fff;border:0;box-shadow:0 8px 22px rgba(168,85,247,0.45)}
#pull{height:0;overflow:hidden;background:#0A0A12;display:flex;align-items:center;justify-content:center;gap:8px;transition:height 0.2s}
#pull span{font-size:13px;color:#a855f7;font-weight:600}
.pull-spinner{width:18px;height:18px;border:3px solid #222;border-top:3px solid #a855f7;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;width:100%;height:calc(100vh - 72px - 74px);overflow:hidden;background:#0A0A12;border-radius:18px 18px 0 0}
iframe{width:100%;height:100%;border:0;display:block;background:#0A0A12}
</style>
</head>
<body>

<header id="header">
<div class="logo-badge">✂️</div>
<div class="logo-col">
<div class="logo-text">ClipShort <span>AI</span></div>
<div class="logo-sub">Clipper + <b>Instagram Downloader</b> • MP3</div>
</div>
</header>

<div class="tabs">
<button class="tab active" id="tabClipper" onclick="showTab('clipper')">✂️ CLIPPER</button>
<button class="tab" id="tabInsta" onclick="showTab('insta')">📸 DOWNLOADER INSTA</button>
</div>

<div id="pull"><div class="pull-spinner" id="pullSpin"></div><span id="pullText">↓ Pull to Refresh</span></div>

<div class="wrap">
<iframe id="appFrame" src="https://clipshort-ai.streamlit.app/?embed=true"></iframe>
</div>

<script>
let frame = document.getElementById('appFrame');
function showTab(type){
  document.getElementById('tabClipper').classList.remove('active');
  document.getElementById('tabInsta').classList.remove('active');
  if(type === 'clipper'){ document.getElementById('tabClipper').classList.add('active'); }
  else { document.getElementById('tabInsta').classList.add('active'); }
  frame.src = frame.src;
}
let startY = 0;
let pull = document.getElementById('pull');
let pullText = document.getElementById('pullText');
let pullSpin = document.getElementById('pullSpin');
let header = document.getElementById('header');
header.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; }, {passive:true});
header.addEventListener('touchmove', function(e){
  let diff = e.touches[0].clientY - startY;
  if(diff > 0){ let h = Math.min(diff, 50); pull.style.height = h + 'px'; pullText.textContent = diff > 40 ? 'Release to Refresh...' : '↓ Pull to Refresh'; }
}, {passive:true});
header.addEventListener('touchend', function(){
  let h = parseInt(pull.style.height || 0);
  if(h >= 40){ pullText.textContent = 'Refreshing...'; pullSpin.style.display = 'block'; pull.style.height = '40px'; frame.src = frame.src; setTimeout(function(){ pull.style.height = '0px'; pullSpin.style.display = 'none'; pullText.textContent = '↓ Pull to Refresh'; }, 1000); }
  else { pull.style.height = '0px'; }
}, {passive:true});
</script>
</body>
</html>
