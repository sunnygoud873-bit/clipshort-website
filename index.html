<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPSHORT AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;text-align:center}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:900}.logo span{color:#ff0050}
header a{background:#ff0050;color:#fff;text-decoration:none;padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px}
h1{font-size:30px;padding:35px 20px 10px;line-height:1.2}
h1 span{color:#ff0050}
p{color:#aaa;padding:0 20px 20px;font-size:15px}
.app{max-width:900px;margin:0 auto;padding:0 12px 20px}
iframe{width:100%;height:750px;border:2px solid #222;border-radius:16px;background:#fff}
.open{display:inline-block;background:#fff;color:#000;padding:12px 22px;border-radius:30px;text-decoration:none;font-weight:800;margin-top:12px;font-size:14px}
.note{color:#777;font-size:12px;margin-top:10px}
</style>
</head>
<body>

<header>
<div class="logo">CLIPSHORT <span>AI</span></div>
<a href="https://clipshort-ai.streamlit.app" target="_blank">Open App ↗</a>
</header>

<h1>Paste YouTube Link<br><span>Get Your Clip</span></h1>
<p>Link paste chey - Clip download chesko. Simple.</p>

<div class="app">
<iframe src="https://clipshort-ai.streamlit.app/?embed=true"></iframe>
<br>
<a class="open" href="https://clipshort-ai.streamlit.app" target="_blank">App Open Avvatledha? Ikkada Click Chey ↗</a>
<p class="note">App open avvadam late aithe - 30 sec wait chey - App sleep nunchi leputhundhi.</p>
</div>

</body>
</html>
