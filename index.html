<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLIPSHORT AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;overflow:hidden;font-family:'Inter',sans-serif}
/* HEADER - LEFT SIDE ⬅️ */
header{height:60px;display:flex;justify-content:flex-start;align-items:center;gap:9px;background:#000;border-bottom:1px solid #1a1a1a;position:relative;z-index:100;padding:0 16px}
.logo-badge{width:32px;height:32px;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(168,85,247,0.4)}
.logo-text{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:21px;font-weight:800;letter-spacing:-0.6px;color:#fff;line-height:1}
.logo-text span{background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.logo-sub{font-size:9px;font-weight:700;letter-spacing:2.5px;color:#888;margin-top:2px;text-transform:uppercase}
.logo-col{display:flex;flex-direction:column;align-items:flex-start}
#pull{height:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;gap:8px;transition:height 0.2s}
#pull span{font-size:13px;color:#a855f7;font-weight:600;font-family:'Inter',sans-serif}
.pull-spinner{width:18px;height:18px;border:3px solid #222;border-top:3px solid #a855f7;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;width:100%;height:calc(100vh - 60px);overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:0;display:block;background:#000}
</style>
</head>
<body>

<header id="header">
<div class="logo-badge">✂️</div>
<div class="logo-col">
<div class="logo-text">ClipShort <span>AI</span></div>
<div class="logo-sub">Pro Clipper</div>
</div>
</header>

<div id="pull"><div class="pull-spinner" id="pullSpin"></div><span id="pullText">↓ Pull to Refresh</span></div>

<div class="wrap">
<iframe id="appFrame" src="https://clipshort-ai.streamlit.app/?embed=true"></iframe>
</div>

<script>
let startY = 0;
let frame = document.getElementById('appFrame');
let pull = document.getElementById('pull');
let pullText = document.getElementById('pullText');
let pullSpin = document.getElementById('pullSpin');
let header = document.getElementById('header');
header.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; }, {passive:true});
header.addEventListener('touchmove', function(e){
  let diff = e.touches[0].clientY - startY;
  if(diff > 0){ let h = Math.min(diff, 50); pull.style.height = h + 'px'; pullText.textContent = diff > 40 ? 'Release to Refresh...' : '↓ Pull to Refresh'; }
}, {passive:true});
header.addEventListener('touchend', function(){
  let h = parseInt(pull.style.height || 0);
  if(h >= 40){ pullText.textContent = 'Refreshing...'; pullSpin.style.display = 'block'; pull.style.height = '40px'; frame.src = frame.src; setTimeout(function(){ pull.style.height = '0px'; pullSpin.style.display = 'none'; pullText.textContent = '↓ Pull to Refresh'; }, 1000); }
  else { pull.style.height = '0px'; }
}, {passive:true});
</script>

</body>
</html>
