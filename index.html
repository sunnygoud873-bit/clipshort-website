<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPSHORT AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-size:21px;font-weight:900;line-height:1}.logo span{color:#ff0050}
.logo small{display:block;font-size:9px;color:#888;font-weight:400;letter-spacing:1px;margin-top:2px}
.btn{background:#ff0050;color:#fff;text-decoration:none;padding:9px 15px;border-radius:20px;font-weight:800;font-size:13px}
.wrap{position:relative;width:100%;height:calc(100vh - 60px);background:#fff}
#loader{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
#loader b{font-size:18px}
#loader p{color:#666;font-size:13px;margin-top:8px}
.spinner{width:40px;height:40px;border:4px solid #eee;border-top:4px solid #ff0050;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.footer{text-align:center;color:#777;font-size:12px;padding:12px;background:#000}
</style>
</head>
<body>

<header>
<div class="logo">CLIPSHORT <span>AI</span><small>YOUTUBE TO SHORTS</small></div>
<a class="btn" href="https://clipshort-ai.streamlit.app" target="_blank">Full App ↗</a>
</header>

<div class="wrap">
<div id="loader">
<div class="spinner"></div>
<b>CLIPSHORT AI Loading...</b>
<p>30 sec wait chey - App ready avthundi ⏳</p>
</div>
<iframe src="https://clipshort-ai.streamlit.app/?embed=true" onload="document.getElementById('loader').style.display='none'"></iframe>
</div>

<div class="footer">© 2026 CLIPSHORT AI - Made in India 🇮🇳</div>

</body>
</html>
